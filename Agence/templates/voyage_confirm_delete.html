{% extends 'maitre.html' %}
{% block titre %}<title>Supprimer le voyage</title>{% endblock %}
{% block contenu %}
<div class="card border-danger mx-auto" style="max-width: 36rem;">
  <div class="card-body">
    <h1 class="h4 card-title">Supprimer « {{ object }} »?</h1>

  </div>
</div>
{% endblock %}
