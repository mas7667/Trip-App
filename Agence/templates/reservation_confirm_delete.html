{% extends 'maitre.html' %}
{% block titre %}<title>Supprimer la réservation</title>{% endblock %}
{% block contenu %}
<div class="card border-danger mx-auto" style="max-width: 36rem;">
  <div class="card-body">
    <h1 class="h4 card-title">Supprimer cette réservation?</h1>
    <p class="text-muted">Cette action est définitive.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Confirmer la suppression</button>
      <a class="btn btn-outline-secondary" href="{% url 'reservations_lists' %}">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
